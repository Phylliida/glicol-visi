<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strudel Visual Editor</title>
    <script src="https://unpkg.com/@strudel/repl@latest"></script>
    <link rel="stylesheet" href="style.css">
    <script src="tuning-utils.js"></script>
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <div class="toolbar-row">
                <h1>Strudel Visual Editor</h1>
                <div class="toolbar-actions">
                    <button id="save-btn" class="action-btn">Save Now</button>
                    <button id="history-btn" class="action-btn">View History</button>
                    <span id="status" class="status"></span>
                </div>
            </div>
            <div id="node-palette">
                <button class="add-node" data-type="text">+ Text</button>
                <button class="add-node" data-type="notes">+ Notes</button>
                <button class="add-node" data-type="code">+ Code</button>
            </div>
        </div>
        <div id="workspace">
            <div id="canvas-container">
                <svg id="connections-layer"></svg>
                <div id="nodes-layer"></div>
            </div>
            <div id="resize-handle" aria-hidden="true"></div>
            <div id="code-panel">
                <div class="panel-controls">
                    <button class="action-btn" id="play-btn">Play</button>
                    <button class="action-btn" id="update-btn">Update</button>
                    <label class="auto-update-toggle" for="auto-update-toggle">
                        <input type="checkbox" id="auto-update-toggle" checked>
                        <span>Auto Update</span>
                    </label>
                </div>
                <div class="panel-header">Code Nodes</div>
                <strudel-editor></strudel-editor>
            </div>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
