<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glicol Visual Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <div class="toolbar-row">
                <h1>Glicol Visual Editor</h1>
                <div class="toolbar-actions">
                    <button id="save-btn" class="action-btn">Save Now</button>
                    <button id="history-btn" class="action-btn">View History</button>
                    <span id="status" class="status"></span>
                </div>
            </div>
            <div id="node-palette">
                <button class="add-node" data-type="notes">+ Notes</button>
                <button class="add-node" data-type="code">+ Code</button>
            </div>
        </div>
        <div id="workspace">
            <div id="canvas-container">
                <svg id="connections-layer"></svg>
                <div id="nodes-layer"></div>
            </div>
            <div id="code-panel">
                <div class="panel-header">Code Nodes</div>
                <textarea id="code-panel-text" readonly placeholder="Code node contents will appear here"></textarea>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
